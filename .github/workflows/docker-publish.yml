name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # แปลงเป็นชื่อ lowercase เช่น ghcr.io/gxmngi
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy
            context: ./services/proxy
            dockerfile: ./services/proxy/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/stratus-proxy

          - name: api
            context: ./services/api
            dockerfile: ./services/api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/stratus-api

          - name: builder
            context: ./services/builder
            dockerfile: ./services/builder/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/stratus-builder

          - name: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/stratus-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max