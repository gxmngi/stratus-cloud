name: stratus

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/gxmngi/stratus-api:latest
    restart: unless-stopped
    environment:
      PORT: "4000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATA_DIR: /data
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - stratus_data:/data
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  builder:
    image: ghcr.io/gxmngi/stratus-builder:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WORKSPACE_DIR: /workspace
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HOST_WORKSPACE_PATH: ${STRATUS_WORKSPACE_HOST_PATH:-/var/lib/stratus/workspace}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STRATUS_WORKSPACE_HOST_PATH:-/var/lib/stratus/workspace}:/workspace
      - ./fixtures:/fixtures:ro
    depends_on:
      redis:
        condition: service_healthy

  proxy:
    image: ghcr.io/gxmngi/stratus-proxy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    environment:
      PORT: "8000"
      WORKSPACE_DIR: /workspace
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      TLS_DOMAINS: ${TLS_DOMAINS:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${STRATUS_WORKSPACE_HOST_PATH:-/var/lib/stratus/workspace}:/workspace:ro
      - certs:/certs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/gxmngi/stratus-web:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"

volumes:
  redis_data:
  certs:
  stratus_data: